<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show da Termo</title>
<meta name="description" content="Show do Milhão de Termodinâmica para a P2: 1ª lei para volume de controle, Rankine e Brayton.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root { color-scheme: dark;
  --bg: #0a0f1e; --bg2: #0f1630; --panel: #141c35; --panel2: #1b2546; --line: #29355e; --ink: #eef2ff; --muted: #9ba7cb;
  --accent: #ff8a4f; --accent-ink: #1d0a00; --accent-soft: rgba(255, 138, 79, .14);
  --gold: #f5c451; --gold-ink: #241800; --ok: #3ddc97; --ok-bg: rgba(61, 220, 151, .15); --bad: #ff6b7a; --bad-bg: rgba(255, 107, 122, .15);
  --hint-bg: rgba(245, 196, 81, .12);
  --f-display: "Chakra Petch", "Arial Narrow", Arial, sans-serif; --f-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; --f-mono: "IBM Plex Mono", Consolas, monospace; --r: 16px; }
* { box-sizing: border-box }
[hidden] { display: none !important }
html { background: var(--bg) }
body { margin: 0; color: var(--ink); font: 400 16px/1.5 var(--f-body); min-height: 100vh;
  background: radial-gradient(900px 520px at 50% -140px, #5a2a14 0%, rgba(90, 42, 20, 0) 70%), var(--bg) }
#app { max-width: 760px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)) }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.kicker { font: 600 11px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
sub, sup { font-size: .72em; line-height: 0 }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 0; background: linear-gradient(var(--bg) 70%, rgba(10, 15, 30, 0)) }
.top .ttl { flex: 1; min-width: 0; display: grid; line-height: 1.2 }
.top .ttl b { font: 700 18px var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font: 600 14px var(--f-mono); white-space: nowrap }
.pill.gold { color: var(--gold); border-color: rgba(245, 196, 81, .4) }
.menu { display: grid; gap: 14px; padding-top: 4px }
.hello { padding: 8px 2px 4px; display: grid; gap: 8px }
.hello h1 { font-size: clamp(30px, 9vw, 48px); line-height: 1.05 }
.hello h1 em { font-style: normal; color: var(--accent) }
.lead { margin: 0; color: var(--muted); max-width: 60ch }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 10px }
.tile p { margin: 0; color: var(--muted) } .tile h2 { font-size: 22px }
.feature { border: 1.5px solid rgba(245, 196, 81, .55); background: radial-gradient(420px 220px at 100% 0%, rgba(245, 196, 81, .22), rgba(245, 196, 81, 0) 70%), var(--panel2); padding: 22px 18px }
.feature h2 { font-size: clamp(28px, 7vw, 38px); color: var(--gold) }
.go { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; border: 0; background: var(--gold); color: var(--gold-ink); font: 700 17px var(--f-display) }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px }
.chipbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); font-weight: 500; font-size: 15px }
.chipbtn:active, .go:active, .btn:active:not(:disabled), .opt:active:not(:disabled) { transform: scale(.98) }
.tswitch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2) }
.tswitch small { display: block; color: var(--muted); font-size: 12px }
.tswitch input { width: 22px; height: 22px; accent-color: var(--accent) }
.how summary { cursor: pointer; font: 700 16px var(--f-display); list-style: none } .how summary::-webkit-details-marker { display: none }
.how ol { margin: 8px 0 0; padding-left: 20px; color: var(--muted) }
.timer { position: relative; height: 26px; border-radius: 13px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; margin-bottom: 12px }
.timer i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .25s linear }
.timer.low i { background: var(--bad) }
.timer span { position: relative; display: grid; place-items: center; height: 100%; font: 700 13px var(--f-mono); text-shadow: 0 1px 2px rgba(0, 0, 0, .6) }
.ladder { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 10px; scroll-behavior: smooth }
.ladder::-webkit-scrollbar { display: none }
.step { flex: none; min-width: 52px; height: 30px; padding: 0 8px; border-radius: 8px; display: grid; place-items: center; font: 600 12px var(--f-mono); background: var(--panel); border: 1px solid var(--line); color: var(--muted) }
.step.won { background: var(--ok-bg); border-color: rgba(61, 220, 151, .5); color: var(--ok) }
.step.now { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); transform: scale(1.06) }
.step.mil { border-color: rgba(245, 196, 81, .6); color: var(--gold) }
.stakes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px }
.stakes span { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.stakes b { display: block; font: 700 15px var(--f-display); color: var(--ink); text-transform: none; letter-spacing: 0 }
.stakes .up b { color: var(--gold) } .stakes .down b { color: var(--bad) }
.play { display: grid; gap: 12px }
.lifelines { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.life { display: grid; justify-items: center; gap: 4px; padding: 8px 2px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-size: 11px; color: var(--muted) }
.life .ring { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); color: var(--gold); border: 1.5px solid rgba(245, 196, 81, .45); position: relative }
.life .cnt { position: absolute; top: -4px; right: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--gold); color: var(--gold-ink); font: 700 11px/18px var(--f-mono) }
.life:disabled { opacity: .3 }
.card-q { background: linear-gradient(var(--panel2), var(--panel)); border: 1px solid rgba(245, 196, 81, .35); border-radius: var(--r); padding: 18px 16px; display: grid; gap: 14px }
.q { font-size: 18px; line-height: 1.45; font-weight: 500 }
.opts { display: grid; gap: 10px }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 10px 14px 10px 10px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel2); font-size: 16px }
.opt .let { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--f-display); background: var(--bg2); color: var(--accent); border: 1px solid var(--line) }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px rgba(255, 138, 79, .15) }
.opt.sel .let { background: var(--accent); color: var(--accent-ink) }
.opt.ok { border-color: var(--ok); background: var(--ok-bg) } .opt.ok .let { background: var(--ok); color: #03140c }
.opt.bad { border-color: var(--bad); background: var(--bad-bg) } .opt.bad .let { background: var(--bad); color: #22040a }
.opt.gone { opacity: .18 } .opt:disabled { cursor: default }
.fb { border-radius: 14px; padding: 12px 14px; font-size: 15px; display: grid; gap: 6px; border: 1px solid transparent }
.fb.ok { background: var(--ok-bg); border-color: rgba(61, 220, 151, .4) } .fb.bad { background: var(--bad-bg); border-color: rgba(255, 107, 122, .4) } .fb.hint { background: var(--hint-bg); border-color: rgba(245, 196, 81, .35) }
.fb b.t { font: 700 16px var(--f-display) } .fb.ok b.t { color: var(--ok) } .fb.bad b.t { color: var(--bad) } .fb.hint b.t { color: var(--gold) }
.dock { position: sticky; bottom: 0; z-index: 15; display: flex; gap: 10px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(rgba(10, 15, 30, 0), var(--bg) 30%) }
.btn { flex: 1; min-height: 54px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--panel); font: 700 16px var(--f-display); display: inline-flex; align-items: center; justify-content: center; gap: 8px }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) } .btn.gold { background: var(--gold); color: var(--gold-ink); border-color: var(--gold) }
.btn:disabled { opacity: .4; cursor: default }
.bars { display: grid; gap: 6px } .bars span { display: grid; grid-template-columns: 18px 1fr 42px; gap: 8px; align-items: center; font-size: 13px }
.bars i { display: block; height: 12px; background: var(--gold); border-radius: 6px }
.votes { display: flex; gap: 8px } .votes span { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--panel2); border: 1px solid var(--line); font: 700 15px var(--f-display); color: var(--gold) }
.egg { margin-left: 6px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(245, 196, 81, .5); background: transparent; color: var(--gold); font-size: 12px; line-height: 1; padding: 0; vertical-align: middle }
.eggtxt { display: block; margin-top: 6px; color: var(--gold); text-transform: none; letter-spacing: 0; font: 500 13px var(--f-body) }
.sumcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px }
.hist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px }
.hist li { background: var(--panel2); border-radius: 12px; padding: 10px 12px; border-left: 4px solid var(--ok) } .hist li.badrow { border-left-color: var(--bad) }
.hist .why { color: var(--muted); font-size: 13px; margin-top: 4px }
.big-score { text-align: center; display: grid; gap: 6px; padding: 22px 16px; border-radius: var(--r); border: 1.5px solid rgba(245, 196, 81, .5); background: var(--panel2) }
.big-score b { font: 700 clamp(32px, 9vw, 48px) var(--f-display); color: var(--gold) }
.trophy { width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: rgba(245, 196, 81, .15); color: var(--gold) } .trophy .ico { width: 38px; height: 38px }
.muted { color: var(--muted); margin: 0; font-size: 14px }
@media (prefers-reduced-motion: no-preference) {
  .card-q, .sumcard { animation: rise .22s ease-out } .pop { animation: pop .45s ease-out } .shake { animation: shake .45s ease-in-out }
  @keyframes rise { from { opacity: .4; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.025); box-shadow: 0 0 0 6px rgba(61, 220, 151, .25) } 100% { transform: scale(1) } }
  @keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-8px) } 40% { transform: translateX(7px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(3px) } }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// estado salvo no navegador (recorde, mudo, cronômetro, moldes já vistos)
let store = {}; try { store = JSON.parse(localStorage.getItem("show-termo-v1") || "{}"); } catch (e) { store = {}; }
const save = () => { try { localStorage.setItem("show-termo-v1", JSON.stringify(store)); } catch (e) {} };
</script>
<script src="perguntas.js"></script>
<script src="som.js"></script>
<script>
const app = document.getElementById("app");
const LADDER = [1e3, 2e3, 3e3, 4e3, 5e3, 1e4, 2e4, 3e4, 4e4, 5e4, 1e5, 2e5, 3e5, 4e5, 5e5, 1e6];
const money = (v) => (v >= 1e6 ? "R$ 1 milhão" : v >= 1e3 ? `R$ ${String(v / 1e3).replace(".", ",")} mil` : `R$ ${v}`);
const svg = (d) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  back: svg('<path d="M15 5l-7 7 7 7"/>'), play: svg('<path d="M8 5l11 7-11 7z"/>'),
  trophy: svg('<path d="M8 4h8v5a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 13v4M8 20h8"/>'),
  skip: svg('<path d="M5 5l9 7-9 7zM17 5v14"/>'), cards: svg('<rect x="4" y="6" width="11" height="14" rx="2"/><path d="M9 4h9a2 2 0 012 2v11"/>'),
  users: svg('<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0M16 6a3 3 0 010 6M17 14a6 6 0 014 6"/>'), chart: svg('<path d="M5 20V10M12 20V4M19 20v-7"/>'),
  spk: (on) => svg(on ? '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/>' : '<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>'),
};
const muteBtn = () => `<button class="iconbtn" id="mute" aria-label="${SOM.isMuted() ? "Ligar o som" : "Desligar o som"}" aria-pressed="${SOM.isMuted()}">${ICON.spk(!SOM.isMuted())}</button>`;
function bindMute() { const b = document.getElementById("mute"); if (b) b.onclick = () => { SOM.setMute(!SOM.isMuted()); b.outerHTML = muteBtn(); bindMute(); if (!SOM.isMuted() && SH && SH.cur && SH.cur.state === "ask") SOM.think(true); }; }
const $ = (id) => document.getElementById(id);

/* ---------------- menu ---------------- */
function home() {
  stopTimer(); SOM.think(false); SH = null; TR = null;
  app.innerHTML = `
  <header class="top"><div class="ttl"><span class="kicker">Termodinâmica Aplicada · P2</span><b>Show da Termo</b></div>${muteBtn()}</header>
  <main class="menu">
    <div class="hello"><h1>Show da <em>Termo</em></h1>
      <p class="lead">1ª lei para volume de controle, Rankine e Brayton. 16 perguntas, de R$ 1 mil a R$ 1 milhão, com contas de números novos a cada partida.</p>
      <div class="chiprow"><span class="pill gold">${ICON.trophy}Recorde ${money(store.best || 0)}</span></div></div>
    <div class="tile feature"><span class="kicker">Modo principal</span><h2>Show do Milhão</h2>
      <p>Conceitos e contas sorteados, quatro ajudas (pular, cartas, universitários, placas) e a pergunta "Está certo disso?". Errar leva metade do que você já garantiu.</p>
      <button class="go" id="show">Jogar ${ICON.play}</button></div>
    <div class="tile"><h2>Treino livre</h2><p>Sem prêmio e sem pressa: a explicação aparece depois de cada resposta.</p>
      <div class="chiprow"><button class="chipbtn" data-tr="conc">Só conceitos</button><button class="chipbtn" data-tr="num">Só contas</button><button class="chipbtn" data-tr="all">Tudo misturado</button></div></div>
    <label class="tswitch" for="tmr"><span>Cronômetro<small>Desligado por padrão. Ligado: 30 s até R$ 5 mil, 45 s até R$ 50 mil, 60 s depois</small></span><input type="checkbox" id="tmr" ${store.timer ? "checked" : ""}></label>
    <details class="tile how"><summary>Como funciona</summary><ol>
      <li>Cada degrau tem uma pergunta de dificuldade crescente: primeiro conceitos (qual hipótese vale em cada equipamento), depois contas e, no fim, ciclos completos.</li>
      <li>As contas mudam de número a cada partida. O que treina é o roteiro: identificar o equipamento, cortar os termos nulos e achar o h certo.</li>
      <li>As alternativas erradas são enganos reais de prova: unidade (W × kW), energia cinética esquecida, sinal de Q̇ e Ẇ, tabela errada.</li>
      <li>Toque na estrela dourada da pergunta para ver em que material de estudo aquele tema aparece.</li></ol></details>
    <p class="muted">Material de estudo da P2 de Termodinâmica Aplicada. Não é um site oficial da disciplina.</p>
  </main>`;
  bindMute(); $("show").onclick = startShow; $("tmr").onchange = (e) => { store.timer = e.target.checked; save(); };
  app.querySelectorAll("[data-tr]").forEach((b) => (b.onclick = () => startTreino(b.dataset.tr)));
}

/* ---------------- Show do Milhão ---------------- */
let SH = null, TMR = null;
const stopValue = () => (SH.L > 0 ? LADDER[SH.L - 1] : 0);
const errValue = () => (SH.L === 15 ? 0 : Math.floor(stopValue() / 2));
const timeLimit = (L) => (L <= 4 ? 30 : L <= 9 ? 45 : 60);
function remember(tpl) { store.seen = [tpl, ...(store.seen || []).filter((t) => t !== tpl)].slice(0, 22); save(); }
function pickItem(L, avoid) { const q = pickQ(L, [...SH.used, ...(avoid ? [avoid] : [])], store.seen || []); SH.used.push(q.tpl); remember(q.tpl); return q; }
const freshCur = (q) => ({ q, state: "ask", sel: null, hidden: new Set(), extra: "", egg: false, anim: "", timeout: false, t0: Date.now(), limit: timeLimit(SH.L) });
function startShow() {
  SH = { L: 0, used: [], help: { pular: 3, cartas: 1, univ: 1, placas: 1 }, log: [] };
  SH.cur = freshCur(pickItem(0)); renderShow();
}
function stopTimer() { if (TMR) clearInterval(TMR); TMR = null; }
function runTimer() {
  stopTimer(); const c = SH && SH.cur; if (!c || c.state !== "ask" || !store.timer) return;
  const bar = $("tbar"), txt = $("ttxt"); if (!bar) return;
  TMR = setInterval(() => {
    const left = Math.max(0, c.limit - (Date.now() - c.t0) / 1000);
    bar.style.width = (100 * left / c.limit) + "%"; txt.textContent = Math.ceil(left) + " s"; $("tm").classList.toggle("low", left <= 10);
    SOM.urgent(left <= 10); if (left <= 10 && Math.ceil(left) !== c._lastTick) { c._lastTick = Math.ceil(left); SOM.tick(); }
    if (left <= 0) { stopTimer(); answerShow(true); }
  }, 250);
}
function renderShow() {
  const c = SH.cur, q = c.q, L = SH.L;
  const steps = LADDER.map((v, i) => `<span class="step ${i < L ? "won" : i === L ? "now" : ""} ${i === 15 ? "mil" : ""}">${i === 15 ? "1 MI" : v / 1e3 + " mil"}</span>`).join("");
  const life = (k, label, icon) => `<button class="life" data-h="${k}" ${!SH.help[k] || c.state !== "ask" ? "disabled" : ""}><span class="ring">${icon}${k === "pular" && SH.help.pular ? `<span class="cnt">${SH.help.pular}</span>` : ""}</span>${label}</button>`;
  const opts = q.opts.map((o, i) => {
    const cls = [c.sel === i ? "sel" : "", c.hidden.has(i) ? "gone" : "", c.state === "done" && i === q.ans ? "ok" : "", c.state === "done" && c.sel === i && i !== q.ans ? "bad" : ""].join(" ");
    return `<button class="opt ${cls}" data-i="${i}" ${c.hidden.has(i) || c.state === "done" ? "disabled" : ""}><span class="let">${"ABCD"[i]}</span><span>${o}</span></button>`;
  }).join("");
  let fb = "", dock = "";
  if (c.state === "ask") dock = `<button class="btn" id="stop">Parar</button><button class="btn gold" id="ans" ${c.sel !== null ? "" : "disabled"}>Responder</button>`;
  if (c.state === "confirm") { fb = `<div class="fb hint"><b class="t">Está certo disso?</b><div>Alternativa ${"ABCD"[c.sel]}. Se errar, você leva ${money(errValue())}.</div></div>`; dock = `<button class="btn" id="no">Voltar</button><button class="btn gold" id="yes">Sim, é minha resposta</button>`; }
  if (c.state === "done") {
    const right = c.sel === q.ans;
    fb = `<div class="fb ${right ? "ok" : "bad"}"><b class="t">${right ? (L === 15 ? "Você ganhou R$ 1 milhão!" : `Certo! Você tem ${money(LADDER[L])}`) : c.timeout ? `Tempo esgotado. Você leva ${money(errValue())}` : `Errou. Você leva ${money(errValue())}`}</b>${right ? "" : `<div>Certa: <b>${"ABCD"[q.ans]}</b> · ${q.opts[q.ans]}</div>`}<div>${q.why}</div></div>`;
    dock = `<button class="btn ${right ? "gold" : "pri"}" id="go">${right && L < 15 ? `Valendo ${money(LADDER[L + 1])} ${ICON.play}` : "Ver resultado"}</button>`;
  }
  app.innerHTML = `
  <header class="top"><button class="iconbtn" id="back" aria-label="Sair do jogo">${ICON.back}</button>
    <div class="ttl"><span class="kicker">Pergunta ${L + 1} de 16 · ${q.kind === "num" ? "Conta" : "Conceito"}</span><b>${money(LADDER[L])}</b></div>${muteBtn()}</header>
  <div class="ladder" id="ladder">${steps}</div>
  <div class="stakes"><span class="down">Errar<b>${money(errValue())}</b></span><span>Parar<b>${money(stopValue())}</b></span><span class="up">Acertar<b>${money(LADDER[L])}</b></span></div>
  ${store.timer && c.state === "ask" ? `<div class="timer" id="tm"><i id="tbar" style="width:100%"></i><span id="ttxt">${c.limit} s</span></div>` : ""}
  <main class="play">
    <div class="lifelines">${life("pular", "Pular", ICON.skip)}${life("cartas", "Cartas", ICON.cards)}${life("univ", "Universitários", ICON.users)}${life("placas", "Placas", ICON.chart)}</div>
    <div class="card-q ${c.anim}"><span class="kicker">Termodinâmica${L === 15 ? " · pergunta do milhão" : ""}<button class="egg" id="egg" aria-label="Onde isso aparece no material">★</button>${c.egg ? `<span class="eggtxt">Aparece em: ${q.src || "material de estudo da P2"}</span>` : ""}</span>
      <div class="q">${q.q}</div><div class="opts">${opts}</div>${c.extra}${fb}</div>
    <div class="dock">${dock}</div></main>`;
  c.anim = "";
  const lad = $("ladder"), now = lad.querySelector(".now"); if (now) lad.scrollLeft = now.offsetLeft - lad.clientWidth / 2 + now.clientWidth / 2;
  bindMute();
  $("egg").onclick = () => { c.egg = !c.egg; renderShow(); };
  $("back").onclick = () => { stopTimer(); home(); };
  app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { if (c.state !== "ask") return; c.sel = +b.dataset.i; SOM.tick(); renderShow(); }));
  app.querySelectorAll("[data-h]").forEach((b) => (b.onclick = () => useHelp(b.dataset.h)));
  if ($("ans")) $("ans").onclick = () => { c.state = "confirm"; SOM.confirm(); renderShow(); };
  if ($("stop")) $("stop").onclick = () => endShow("parou", stopValue());
  if ($("yes")) $("yes").onclick = () => answerShow(false);
  if ($("no")) $("no").onclick = () => { c.state = "ask"; renderShow(); };
  if ($("go")) $("go").onclick = () => { if (c.sel !== q.ans) return endShow(c.timeout ? "tempo" : "errou", errValue()); if (L === 15) return endShow("milhão", 1e6); SH.L++; SH.cur = freshCur(pickItem(SH.L)); renderShow(); window.scrollTo({ top: 0 }); };
  if (c.state !== "ask" && window.innerWidth < 960) { const f = app.querySelector(".card-q .fb"); if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  SOM.think(c.state === "ask"); runTimer();
}
function answerShow(timeout) {
  const c = SH.cur; if (!c || c.state === "done") return;
  stopTimer(); SOM.urgent(false); c.state = "done"; c.timeout = timeout; if (timeout) c.sel = -1;
  const right = !timeout && c.sel === c.q.ans; c.anim = right ? "pop" : "shake";
  SH.log.push({ L: SH.L, q: c.q, right });
  if (right) SOM.right(SH.L); else if (timeout) SOM.timeout(); else SOM.wrong();
  renderShow();
}
function useHelp(k) {
  const c = SH.cur, q = c.q; if (!SH.help[k] || c.state !== "ask") return;
  SH.help[k]--; SOM.help(k);
  const wrong = q.opts.map((_, i) => i).filter((i) => i !== q.ans && !c.hidden.has(i));
  if (k === "pular") { SH.cur = freshCur(pickItem(SH.L, q.tpl)); return renderShow(); }
  if (k === "cartas") {
    const card = R.pick([["Rei", 0], ["Ás", 1], ["2", 2], ["3", 3]]);
    R.shuffle(wrong).slice(0, card[1]).forEach((i) => c.hidden.add(i)); if (c.sel !== null && c.hidden.has(c.sel)) c.sel = null;
    c.extra += `<div class="fb hint"><b class="t">Cartas: você tirou ${card[0]}</b><div>${card[1] ? `${card[1]} alternativa${card[1] > 1 ? "s erradas saíram" : " errada saiu"}.` : "Nenhuma alternativa saiu."}</div></div>`;
  }
  if (k === "univ") {
    const vis = q.opts.map((_, i) => i).filter((i) => !c.hidden.has(i)), p = Math.max(0.3, 0.85 - SH.L * 0.04);
    const votes = [0, 1, 2].map(() => (Math.random() < p ? q.ans : R.pick(vis.filter((i) => i !== q.ans))));
    c.extra += `<div class="fb hint"><b class="t">Universitários</b><div class="votes">${votes.map((v) => `<span>${"ABCD"[v]}</span>`).join("")}</div><div>Um deles lembra a regra: ${q.hint}</div></div>`;
  }
  if (k === "placas") {
    const vis = q.opts.map((_, i) => i).filter((i) => !c.hidden.has(i));
    const w = vis.map((i) => (i === q.ans ? 0.9 + Math.random() * Math.max(0.3, 2.2 - SH.L * 0.15) : 0.4 + Math.random()));
    const tot = w.reduce((a, b) => a + b, 0), pct = w.map((x) => Math.round(100 * x / tot));
    c.extra += `<div class="fb hint"><b class="t">Placas da plateia</b><div class="bars">${vis.map((i, j) => `<span><b>${"ABCD"[i]}</b><i style="width:${pct[j]}%"></i>${pct[j]}%</span>`).join("")}</div></div>`;
  }
  renderShow();
}
function endShow(how, prize) {
  SOM.think(false); stopTimer();
  store.best = Math.max(store.best || 0, prize); save();
  const rows = SH.log.map((l) => `<li class="${l.right ? "" : "badrow"}"><b>${money(LADDER[l.L])}</b> · ${l.q.kind === "num" ? "Conta" : "Conceito"}<div>${l.right ? "Acertou." : `Errou. Certa: <b>${"ABCD"[l.q.ans]}</b> · ${l.q.opts[l.q.ans]}`}</div><div class="why">${l.q.why}</div></li>`).join("");
  const title = how === "milhão" ? "Você ganhou R$ 1 milhão!" : how === "parou" ? "Você parou" : how === "tempo" ? "O tempo acabou" : "Fim de jogo";
  app.innerHTML = `<header class="top"><button class="iconbtn" id="back" aria-label="Voltar ao início">${ICON.back}</button><div class="ttl"><span class="kicker">Show da Termo</span><b>${title}</b></div><span class="pill gold">${ICON.trophy}${money(store.best || 0)}</span></header>
  <main class="menu"><div class="big-score"><div class="trophy">${ICON.trophy}</div><span class="kicker">você leva</span><b>${money(prize)}</b><span class="kicker">recorde ${money(store.best || 0)}</span></div>
    <div class="sumcard"><h3>Suas respostas</h3><ol class="hist">${rows || "<li>Nenhuma resposta.</li>"}</ol><p class="muted">Cada partida sorteia números novos: o que conta é o roteiro, não decorar o resultado.</p></div>
    <div class="dock"><button class="btn" id="home">Início</button><button class="btn gold" id="again">Jogar de novo</button></div></main>`;
  $("again").onclick = startShow; $("home").onclick = home; $("back").onclick = home; window.scrollTo({ top: 0 });
}

/* ---------------- treino livre ---------------- */
let TR = null;
function startTreino(kind) { TR = { kind, used: [], n: 0, ok: 0, streak: 0, best: 0 }; nextTreino(); }
function nextTreino() {
  let q = null; for (let i = 0; i < 30; i++) { q = pickAny(TR.used.slice(0, 6), store.seen || []); if (q && (TR.kind === "all" || q.kind === TR.kind)) break; }
  if (!q || (TR.kind !== "all" && q.kind !== TR.kind)) q = pickAny([]);
  TR.used.unshift(q.tpl); TR.cur = { q, sel: null, done: false }; renderTreino();
}
function renderTreino() {
  const c = TR.cur, q = c.q;
  const opts = q.opts.map((o, i) => {
    const cls = [c.sel === i ? "sel" : "", c.done && i === q.ans ? "ok" : "", c.done && c.sel === i && i !== q.ans ? "bad" : ""].join(" ");
    return `<button class="opt ${cls}" data-i="${i}" ${c.done ? "disabled" : ""}><span class="let">${"ABCD"[i]}</span><span>${o}</span></button>`;
  }).join("");
  const right = c.done && c.sel === q.ans;
  const fb = c.done ? `<div class="fb ${right ? "ok" : "bad"}"><b class="t">${right ? "Certo!" : "Não foi dessa vez"}</b>${right ? "" : `<div>Certa: <b>${"ABCD"[q.ans]}</b> · ${q.opts[q.ans]}</div>`}<div>${q.why}</div><div class="muted">Aparece em: ${q.src || "material de estudo da P2"}</div></div>` : "";
  app.innerHTML = `<header class="top"><button class="iconbtn" id="back" aria-label="Voltar ao início">${ICON.back}</button><div class="ttl"><span class="kicker">Treino livre · ${q.kind === "num" ? "Conta" : "Conceito"}</span><b>${TR.ok} de ${TR.n} · sequência ${TR.streak}</b></div>${muteBtn()}</header>
  <main class="play"><div class="card-q ${c.anim || ""}"><div class="q">${q.q}</div><div class="opts">${opts}</div>${fb}</div>
    <div class="dock">${c.done ? `<button class="btn gold" id="next">Próxima ${ICON.play}</button>` : `<button class="btn" id="home">Sair</button><button class="btn pri" id="ok" ${c.sel === null ? "disabled" : ""}>Responder</button>`}</div></main>`;
  c.anim = ""; bindMute(); $("back").onclick = home; if ($("home")) $("home").onclick = home;
  app.querySelectorAll(".opt").forEach((b) => (b.onclick = () => { if (c.done) return; c.sel = +b.dataset.i; SOM.tick(); renderTreino(); }));
  if ($("ok")) $("ok").onclick = () => { c.done = true; TR.n++; const r = c.sel === q.ans; if (r) { TR.ok++; TR.streak++; SOM.right(Math.min(8, TR.streak)); } else { TR.streak = 0; SOM.wrong(); } c.anim = r ? "pop" : "shake"; renderTreino(); };
  if ($("next")) $("next").onclick = () => { nextTreino(); window.scrollTo({ top: 0 }); };
}
home();
</script>
</body>
